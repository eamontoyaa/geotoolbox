[project]
name = "geotoolbox"
version = "0.2.0"
description = "A collection of tools for geospatial, geotechnical, and statistical data processing and modelling"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Exneyder A. Montoya-Araque", email = "eamontoyaa@eafit.edu.co" },
    {name = "Daniel F. Ruiz", email = "dfruizr@eafit.edu.co" },
    {name = "Universidad EAFIT"},
]
requires-python = ">=3.12"
dependencies = [
    "affine>=3.0.1",
    "geopandas>=1.1.4",
    "ipykernel>=6.17.1",
    "ipympl>=0.10.0",
    "matplotlib>=3.10.0",
    "numba>=0.61.2",
    "numpy>=2.1.3",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "psutil>=5.9.5",
    "pynewmarkdisp>=0.1.0",
    "pysheds>=0.5",
    "rasterio>=1.5.1",
    "rasterstats>=0.21.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.16.3",
    "shapely>=2.1.2",
    "tol-colors>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest==8.4.2"]
