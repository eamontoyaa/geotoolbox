[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geotoolbox"
version = "0.1.0"
description = "A collection of tools for geospatial, geotechnical, and statistical data processing and modelling"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Exneyder A. Montoya-Araque"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
keywords = ["geospatial", "geotechnical", "statistics", "data processing", "modelling"]

[project.urls]
Homepage = "https://github.com/eamontoyaa/geotoolbox"
Repository = "https://github.com/eamontoyaa/geotoolbox"
Issues = "https://github.com/eamontoyaa/geotoolbox/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["geotoolbox*"]
